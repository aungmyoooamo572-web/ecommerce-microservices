spring.application.name=saga-gateway

server.port=8080

#saga-affablebean-backend
spring.cloud.gateway.server.webmvc.routes[0].id=affablebean-backend
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://SAGA-AFFABLEBEAN-BACKEND
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/backend/**

#saga-affablebean-ui
spring.cloud.gateway.server.webmvc.routes[1].id=affablebean-ui
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://SAGA-AFFABLEBEAN-UI
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/ui/products/**,/css/**,/images/**

#saga-security-service
spring.cloud.gateway.server.webmvc.routes[2].id=affablebean-security
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://SAGA-SECURITY-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/auth/**,/api/security/**


#saga-payment-service
spring.cloud.gateway.server.webmvc.routes[3].id=affablebean-payment
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://SAGA-PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payment/**









eureka.client.service-url.defaultZone=http://localhost:8083/eureka